# Shop-Konfiguration für den KI Sortiments Scout.
# Für einen anderen niceshops-Shop: Datei kopieren, [shop], [export], [signals] und [[taxonomy]] anpassen.

[shop]
id = "vitalabo"
name = "Vitalabo"
url = "https://www.vitalabo.at"
brands_file = "data/marken_vitalabo_at.txt"   # Markenliste von vitalabo.at/marken (Ausschlussliste)
positioning = """
Onlineshop für hochwertige Nahrungsergänzungsmittel, Vitalstoffe und natürliche Gesundheitsprodukte (seit 2006,
erster Shop der niceshops-Gruppe). Kombiniert bekannte Hersteller (z. B. Pure Encapsulations, Nature's Plus,
Burgerstein) mit jungen, innovativen Marken. Abo-Modell: Produkte mit regelmäßigem Wiederkauf passen besonders gut.
Zielgruppe: gesundheitsbewusste Endkund:innen im DACH-Raum und darüber hinaus.
"""

[export]
path = "data/vitalabo-produktdaten.csv"
skip_rows = 3
col_ean = "EAN"
col_name = "WAWI-Bezeichnung"
col_brand = "Marke (WaWi Produkt)"

[signals]
sources = ["amazon", "iherb"]
window_days = 7            # der wöchentliche Agent wertet die Tagesstände der letzten 7 Tage aus

[signals.amazon]
actor = "junglee/amazon-bestsellers"            # Apify-Scraper
category_path = "drugstore/64374031"            # Amazon.de: Vitamine, Mineralien & Ergänzungsmittel
lists = ["bestsellers", "new-releases"]
max_items = 100

[models]
# Erste verfügbare OpenRouter-Modell-ID pro Rolle wird verwendet.
classify = ["google/gemini-2.5-flash", "openai/gpt-5-mini", "openai/gpt-4.1-mini", "openrouter/auto"]
research = ["anthropic/claude-sonnet-4.5", "openai/gpt-5.2", "openai/gpt-5", "google/gemini-2.5-pro", "openrouter/auto"]

[scan]
top_brand_gaps = 12        # so viele Marken-Lücken bekommen eine Fit-Bewertung mit Websuche
top_trends = 15            # so viele Wirkstoffe/Konzepte bekommen eine Trend-Einschätzung
wikipedia_check = true     # Interesse-Verlauf (24 Monate) für die Top-Trends messen

[scoring]
# Gewichte (Summe = 1). Nachfrage ist gemessen und zählt doppelt.
demand = 0.5
ecommerce_fit = 0.25
niceshops_fit = 0.25

# Warengruppen-Taxonomie. Solange keine interne niceshops-Warengruppenstruktur vorliegt, ist das eine Annahme.
[[taxonomy]]
code = "VIT"
name = "Vitamine"
hint = "Einzelvitamine und Vitamin-Komplexe, Multivitamine"
